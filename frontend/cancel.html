<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled | Pink Pixies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDF2F8;
        }

        h1 {
            font-family: 'Playfair Display', serif;
        }

        .glass {
            background-color: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 4px 24px -2px rgba(190, 24, 93, 0.07), 0 1.5px 6px -1px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">
    <div
        class="glass max-w-md w-full rounded-luxury p-10 text-center shadow-22xl border border-brand-border animate-pop">
        <div
            class="w-20 h-20 bg-brand-pink-soft rounded-luxury flex items-center justify-center mx-auto mb-8 border border-brand-border">
            <svg class="w-10 h-10 text-brand-pink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-black text-text-main uppercase tracking-widest mb-6">Session Aborted</h1>
        <p class="text-brand-gray/40 text-[10px] font-black uppercase tracking-widest leading-loose mb-10">No worries!
            Your session synchronization was cancelled and no assets were transferred. You can re-initialize whenever
            you're ready.</p>

        <div class="space-y-4">
            <a href="index.html" class="block w-full btn-pink py-5">
                Try Again
            </a>
            <a href="index.html"
                class="block w-full text-[9px] font-black uppercase tracking-[0.4em] text-brand-pink hover:text-brand-pink/60 transition-all">
                Return to Gallery
            </a>
        </div>
    </div>
</body>

</html>
